profile: default
fields:
  - key: external_id
    label: External ID
    type: text
    source: static
    validation:
      required: false
  - key: work_period
    label: Work Period
    type: text
    source: static
  - key: priority
    label: Priority
    type: select
    source: static
    validation:
      options: [High, Medium, Low]
  - key: category
    label: Category
    type: text
    source: static
  - key: input_due
    label: Input Due
    type: date
    source: dynamic
  - key: ready_to_start
    label: Ready to Start
    type: date
    source: computed
  - key: review_due
    label: Review Due
    type: date
    source: computed
  - key: phase
    label: Phase
    type: text
    source: computed
